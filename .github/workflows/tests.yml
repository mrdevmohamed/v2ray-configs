name: Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - "Files/**"
      - ".github/workflows/tests.yml"
  push:
    branches:
      - main
    paths:
      - "Files/**"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Files/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r Files/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s Files -p 'test_*.py' -v

      - name: Compile-check Python files
        run: |
          python -m py_compile \
            Files/app.py \
            Files/sort.py \
            Files/telegram_notify.py \
            Files/test_configs.py \
            Files/test_telegram_notify.py
