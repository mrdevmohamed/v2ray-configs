name: Update Configs
permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - "All_Configs_Sub.txt"
      - "All_Configs_base64_Sub.txt"
      - "Sub*.txt"
      - "Base64/**"
      - "Splitted-By-Protocol/**"
      - "By-Country/**"
      - "server-metrics.json"
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: update-configs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r Files/requirements.txt

      - name: Install sing-box
        run: |
          set -euo pipefail
          SING_BOX_VERSION="v1.14.2"

          curl -fsSL --retry 3 \
            -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION#v}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          install -m 0755 \
            "/tmp/sing-box-${SING_BOX_VERSION#v}-linux-amd64/sing-box" \
            /tmp/sing-box
          /tmp/sing-box version

      - name: Install Xray
        run: |
          set -euo pipefail
          XRAY_VERSION="v26.6.27"
          curl -fsSL --retry 3 \
            -o /tmp/xray.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          rm -rf /tmp/xray
          mkdir -p /tmp/xray
          unzip -q /tmp/xray.zip -d /tmp/xray
          install -m 0755 /tmp/xray/xray /tmp/xray-bin
          /tmp/xray-bin version

      - name: Validate Python
        run: python -m unittest discover -s Files -p 'test_*.py' -v

      - name: Run Python script and save output to file
        run: python Files/app.py

      - name: Run Splitter script and save output to file
        run: python Files/sort.py

      - name: Commit and push files
        uses: EndBug/add-and-commit@v11.1.1
        with:
          author_name: "mrdevmohamed"
          author_email: "mrdevmohamed@gmail.com"
          message: "Fresh🔥❤️‍🔥"
          add: |
            All_Configs_Sub.txt
            All_Configs_base64_Sub.txt
            Sub*.txt
            Base64/Sub*_base64.txt
            Splitted-By-Protocol/*.txt
            By-Country/*.txt
            server-metrics.json
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SING_BOX_BINARY: /tmp/sing-box
      XRAY_BINARY: /tmp/xray-bin
      PROTOCOL_VALIDATION_TIMEOUT: "8"
      PROTOCOL_VALIDATION_WORKERS: "64"
      PROTOCOL_VALIDATION_MAX_RUNTIME: "900"
